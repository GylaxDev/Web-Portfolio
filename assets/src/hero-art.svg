<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="780" viewBox="0 0 2400 780">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9aa95"/>
      <stop offset=".55" stop-color="#cdbf9f"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bcc8" stop-opacity="0"/>
      <stop offset="1" stop-color="#a9bcc8" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181818" stop-opacity="0"/>
      <stop offset="1" stop-color="#181818" stop-opacity="0"/>
    </linearGradient>
    <filter id="marble" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0021 0.0105" numOctaves="3" seed="23" result="n"/>
      <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -.3  1.6 0 0 0 -.3  1.6 0 0 0 -.3  0 0 0 0 1" result="g"/>
      <feComponentTransfer in="g">
        <feFuncR type="discrete" tableValues=".62 1 1 1 .93 .62 1 1 .62"/>
        <feFuncG type="discrete" tableValues=".72 .75 .75 .75 .90 .72 .75 .75 .72"/>
        <feFuncB type="discrete" tableValues=".80 .05 .05 .05 .84 .80 .05 .05 .80"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="mount"><path d="M0,780 L0,640 C260,600 520,560 760,450 C930,372 1040,230 1186,128 C1262,84 1306,118 1376,200 C1510,350 1664,450 1910,520 C2110,575 2250,610 2400,622 L2400,780 Z"/></clipPath>
    <clipPath id="ridge"><path d="M0,780 L0,700 C300,660 600,690 900,640 C1200,590 1500,660 1800,630 C2050,606 2250,650 2400,660 L2400,780 Z"/></clipPath>
  </defs>

  <rect width="2400" height="780" fill="url(#sky)"/>
  <!-- soft far hills -->
  <path d="M0,560 C300,500 600,540 900,470 C1200,400 1500,520 1800,470 C2050,430 2250,480 2400,470 L2400,780 L0,780Z" fill="#c9bfae" opacity=".55"/>

  <!-- marbled mountain -->
  <g clip-path="url(#mount)">
    <g transform="rotate(-24 1200 420)">
      <rect x="-700" y="-500" width="3800" height="1900" filter="url(#marble)"/>
    </g>
    <rect width="2400" height="780" fill="url(#haze)"/>
  </g>

  <!-- foreground ridge -->
  <g clip-path="url(#ridge)">
    <g transform="rotate(14 1200 700)">
      <rect x="-700" y="200" width="3800" height="1200" filter="url(#marble)"/>
    </g>
    <rect width="2400" height="780" fill="#a9bcc8" opacity=".25"/>
  </g>

  <!-- network lines -->
  <g fill="none" stroke="#f6efe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".96">
    <path d="M1186,118 L1150,380 L1120,560 L1150,700"/>
    <path d="M1186,118 L900,330 L560,560 L420,780"/>
    <path d="M1186,118 L1000,280 L640,430 L180,700"/>
    <path d="M1186,118 L1640,470 L2040,640"/>
    <path d="M1520,300 L1640,470 L1760,640 L1900,780"/>
    <path d="M1520,300 L1360,520 L1250,780"/>
    <path d="M1520,300 L1880,330 L2400,560"/>
    <path d="M900,330 L1150,380 L1360,520"/>
    <path d="M640,430 L1000,520 L1150,380"/>
  </g>
  <g fill="#f6efe0">
    <circle cx="1186" cy="118" r="9"/><circle cx="1150" cy="380" r="7"/><circle cx="900" cy="330" r="7"/>
    <circle cx="1520" cy="300" r="8"/><circle cx="1640" cy="470" r="8"/><circle cx="1360" cy="520" r="7"/>
    <circle cx="640" cy="430" r="6"/><circle cx="1000" cy="520" r="6"/><circle cx="1000" cy="280" r="6"/>
    <path d="M1150,350 l-14,32 h28z"/><path d="M1520,268 l-12,28 h24z"/><path d="M900,300 l-12,28 h24z"/>
    <path d="M1250,40 l16,44 l-30,0z" opacity="0"/>
  </g>
</svg>
